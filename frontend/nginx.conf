server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver (127.0.0.11) for dynamic service discovery
    # 'valid=30s' re-resolves every 30s so container restarts are handled
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serve React SPA — client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded images
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/menu → admin-gateway (must use variable for dynamic DNS resolution)
    location /api/menu {
        set $upstream_gateway admin-gateway:3002;
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Proxy all other /api/* → order-service (orders, payment, history, status)
    location /api/ {
        set $upstream_orders order-service:3001;
        proxy_pass http://$upstream_orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Cache static JS/CSS/image assets (Vite uses content-hashed filenames)
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
