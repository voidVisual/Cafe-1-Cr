server {
    listen 80;
    # Replace the below with your domain name if you have one
    server_name _; 

    # 1. Serve the frontend static files
    # Make sure this path points to where your 'dist' folder is on the DigitalOcean server
    # e.g., /var/www/cafe/frontend/dist or /root/Cafe-1-Cr/frontend/dist
    root /root/Cafe-1-Cr/frontend/dist; 
    index index.html;

    # Handle React Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests for the Menu to Admin Gateway (Port 3002)
    location /api/menu {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Proxy all other API requests to the Order Service (Port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
