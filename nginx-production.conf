# ─────────────────────────────────────────────────────────────────────────────
# Cafe-1-Cr  |  Production Nginx Configuration
# This file is the SINGLE entry point for all traffic on your DigitalOcean Droplet.
#
# Traffic routing:
#   yourdomain.com/          → Frontend (Vite static build on port 5173 or as static files)
#   yourdomain.com/api/*     → Backend services via order-service (port 3001) / admin-gateway (3002)
#   admin.yourdomain.com/    → Admin Dashboard (Next.js on port 3000)
#   admin.yourdomain.com/api → Admin Dashboard API (proxied to admin-gateway port 3002)
#   WebSocket (:3002)        → Socket.IO (admin live orders)
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Security
    server_tokens off;
    client_max_body_size 20M;  # Allow large image uploads

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=50r/s;

    # ─── Upstream Definitions ─────────────────────────────────────────────────
    upstream order_service    { server 127.0.0.1:3001; keepalive 8; }
    upstream admin_gateway    { server 127.0.0.1:3002; keepalive 8; }
    upstream kitchen_display  { server 127.0.0.1:3003; keepalive 4; }
    upstream analytics_svc    { server 127.0.0.1:3004; keepalive 4; }
    upstream admin_dashboard  { server 127.0.0.1:3000; keepalive 8; }

    # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME challenge (run: certbot --nginx)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        # Comment this out and use the server block below instead if you don't have SSL yet
        # return 301 https://$host$request_uri;

        # ── NO-SSL FALLBACK (use this block if you have no domain yet) ─────
        # Serve frontend static files directly
        location / {
            root /var/www/cafe/frontend/dist;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Serve uploaded images
        location /images/ {
            alias /var/www/cafe/frontend/dist/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend → order-service (place orders, payment, history)
        location /api/order { proxy_pass http://order_service; include /etc/nginx/proxy_params; }
        location /api/payment { proxy_pass http://order_service; include /etc/nginx/proxy_params; }
        location /api/orders { proxy_pass http://order_service; include /etc/nginx/proxy_params; }

        # Frontend → admin-gateway (menu items)
        location /api/menu {
            proxy_pass http://admin_gateway;
            include /etc/nginx/proxy_params;
        }

        # Admin Dashboard (served at /admin path)
        location /admin {
            proxy_pass http://admin_dashboard;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Prefix /admin;
        }

        # Admin Dashboard internal API calls (menu, orders, analytics, kitchen)
        location /api/admin/ { proxy_pass http://admin_gateway; include /etc/nginx/proxy_params; }
        location /api/analytics { proxy_pass http://analytics_svc; include /etc/nginx/proxy_params; }
        location /api/kitchen { proxy_pass http://kitchen_display; include /etc/nginx/proxy_params; }

        # Socket.IO WebSocket for live orders (admin dashboard)
        location /socket.io/ {
            proxy_pass http://admin_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
        }
    }

    # ─── HTTPS Server (enable after running: sudo certbot --nginx) ────────────
    # Uncomment and configure after you have SSL certificates
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Copy all location blocks from the HTTP server above
    # }
}
