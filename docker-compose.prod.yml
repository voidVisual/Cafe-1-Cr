# ─────────────────────────────────────────────────────────────────────────────
# Cafe-1-Cr  |  Production Docker Compose
# Usage on DigitalOcean:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

networks:
  cafe_net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cafe_postgres
    restart: unless-stopped
    networks: [cafe_net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafe_password}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_user} -d ${POSTGRES_DB:-cafe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: Do NOT expose 5432 publicly in production. Only accessible inside cafe_net.

  mongodb:
    image: mongo:7
    container_name: cafe_mongodb
    restart: unless-stopped
    networks: [cafe_net]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: Do NOT expose 27017 publicly in production.

  kafka:
    image: apache/kafka:latest
    container_name: cafe_kafka
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "9092:9092"  # Exposed so services running on the HOST can connect
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # INTERNAL: used by containers in cafe_net | EXTERNAL: used by host services
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${HOST_IP:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:latest
    container_name: cafe_kafka_init
    networks: [cafe_net]
    depends_on: [kafka]
    restart: "no"
    command: >
      bash -c "
        echo 'Waiting for Kafka...'
        sleep 15
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.created
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.status
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic payments.processed
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic menu.updated
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.analytics
        echo 'Kafka topics created.'
      "

  # ── Application Services (run as Node.js processes on the HOST via PM2) ──────
  # These are NOT containerized here — they run directly on the Droplet.
  # See DEPLOYMENT.md for the PM2 startup commands.
  #
  # Alternatively, you can add them as services here with:
  #   build: ./services/order-service
  #   environment: ...
  # But running on the host is simpler and avoids Docker networking complexity
  # for service-to-service calls.
