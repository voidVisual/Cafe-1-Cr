# ─────────────────────────────────────────────────────────────────────────────
# Cafe-1-Cr  |  Production Docker Compose
# Usage on DigitalOcean:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

networks:
  cafe_net:
    driver: bridge

volumes:
  postgres_data:
services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cafe_postgres
    restart: unless-stopped
    networks: [cafe_net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafe_password}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_user} -d ${POSTGRES_DB:-cafe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: Do NOT expose 5432 publicly in production. Only accessible inside cafe_net.




  # ── Application Services (run as Node.js processes on the HOST via PM2) ──────
  # These are NOT containerized here — they run directly on the Droplet.
  # See DEPLOYMENT.md for the PM2 startup commands.
  #
  # Alternatively, you can add them as services here with:
  #   build: ./services/order-service
  #   environment: ...
  # But running on the host is simpler and avoids Docker networking complexity
  # for service-to-service calls.
