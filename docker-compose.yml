version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Cafe-1-Cr  |  Full Stack Docker Compose
# Runs ALL services in containers for local testing.
#
#   docker compose up --build
#
# Access:
#   Frontend (Cafe Storefront) → http://localhost:8080
#   Admin Dashboard            → http://localhost:3000
#   Admin Gateway API          → http://localhost:3002
#   Order Service API          → http://localhost:3001
# ─────────────────────────────────────────────────────────────────────────────

networks:
  cafe_net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cafe_postgres
    restart: unless-stopped
    networks: [cafe_net]
    environment:
      POSTGRES_USER: cafe_user
      POSTGRES_PASSWORD: cafe_password
      POSTGRES_DB: cafe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_user -d cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6
    container_name: cafe_mongodb
    restart: unless-stopped
    networks: [cafe_net]
    command: ["--nojournal"]
    volumes:
      - mongodb_data:/data/db
    # No healthcheck — MongoDB starts reliably; admin-gateway retries on connect

  kafka:
    image: apache/kafka:latest
    container_name: cafe_kafka
    restart: unless-stopped
    networks: [cafe_net]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    container_name: cafe_kafka_init
    networks: [cafe_net]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
        echo 'Creating Kafka topics...'
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.created
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.status
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic payments.processed
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic menu.updated
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic orders.analytics
        echo 'All Kafka topics created successfully.'
      "

  # ── Application Services ──────────────────────────────────────────────────

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: cafe_order_service
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cafe_user
      DB_PASSWORD: cafe_password
      DB_NAME: cafe_db
      KAFKA_BROKER: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  admin-gateway:
    build:
      context: ./services/admin-gateway
      dockerfile: Dockerfile
    container_name: cafe_admin_gateway
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/cafe_db
      KAFKA_BROKER: kafka:29092
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 3001
      KITCHEN_SERVICE_HOST: kitchen-display
      KITCHEN_SERVICE_PORT: 3003
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./frontend/public/images:/app/uploads
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_healthy

  kitchen-display:
    build:
      context: ./services/kitchen-display
      dockerfile: Dockerfile
    container_name: cafe_kitchen_display
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cafe_user
      DB_PASSWORD: cafe_password
      DB_NAME: cafe_db
      KAFKA_BROKER: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: cafe_analytics
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cafe_user
      DB_PASSWORD: cafe_password
      DB_NAME: cafe_db
      KAFKA_BROKER: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        ADMIN_GATEWAY_URL: http://admin-gateway:3002
        ORDER_SERVICE_URL: http://order-service:3001
        KITCHEN_SERVICE_URL: http://kitchen-display:3003
        ANALYTICS_URL: http://analytics:3004
    container_name: cafe_admin_dashboard
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_GATEWAY_URL: http://admin-gateway:3002
      ORDER_SERVICE_URL: http://order-service:3001
      KITCHEN_SERVICE_URL: http://kitchen-display:3003
      ANALYTICS_URL: http://analytics:3004
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:3002
    depends_on:
      - admin-gateway
      - order-service
      - analytics

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe_frontend
    restart: unless-stopped
    networks: [cafe_net]
    ports:
      - "8080:80"
    volumes:
      # Mount uploaded images so they're served by the frontend nginx
      - ./frontend/public/images:/usr/share/nginx/html/images
    depends_on:
      - order-service
      - admin-gateway
